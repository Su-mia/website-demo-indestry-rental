<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Tech Blue -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A; stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F172A; stop-opacity:1" />
    </linearGradient>
    
    <!-- Icon Gradient: Construction Orange -->
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C00; stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EA580C; stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- App Icon Background (Rounded Square) -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- The Tunnel Formwork Icon (Abstract Inverted 'U') -->
  <path d="M 156 372 L 156 226 C 156 170.8 200.8 126 256 126 C 311.2 126 356 170.8 356 226 L 356 372"
        fill="none" stroke="url(#iconGrad)" stroke-width="60" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Horizontal Connection Beam -->
  <line x1="120" y1="280" x2="392" y2="280" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round" />

  <!-- Digital Hub/Connection Node in the center -->
  <circle cx="256" cy="280" r="35" fill="url(#iconGrad)" />
  <circle cx="256" cy="280" r="15" fill="#FFFFFF" />
</svg>
